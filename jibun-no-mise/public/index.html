<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>じぶんの店</title>
<meta name="description" content="じぶんの店 — ただいま開店準備中です。">
<meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="じぶんの店">
<meta property="og:description" content="ただいま開店準備中です。">
<meta property="og:locale" content="ja_JP">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b4643c'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23faf7f2' font-family='serif'%3E店%3C/text%3E%3C/svg%3E">
<style>
  /* 配色はトークンで一元管理。ライトを基準に、ダークで上書きする。 */
  :root {
    --bg: #faf7f2;
    --bg-accent: #f2ece1;
    --ink: #2b2621;
    --ink-soft: #6b6055;
    --rule: #d9cfc0;
    --brand: #b4643c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1714;
      --bg-accent: #221e1a;
      --ink: #f0e9df;
      --ink-soft: #a3968a;
      --rule: #3b342c;
      --brand: #d98b5f;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, var(--bg-accent), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium",
                 "Yu Gothic", Meiryo, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    text-align: center;
    max-width: 32rem;
    /* 初回表示のふわっとした立ち上がり */
    animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  .mark {
    width: 2.75rem;
    height: 2.75rem;
    margin: 0 auto 2rem;
    border-radius: 0.75rem;
    background: var(--brand);
    color: var(--bg);
    display: grid;
    place-items: center;
    font-size: 1.5rem;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    line-height: 1;
  }

  h1 {
    margin: 0;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
    font-size: clamp(2.25rem, 9vw, 3.25rem);
    font-weight: 600;
    letter-spacing: 0.22em;
    /* letter-spacing の分だけ右に寄るのを打ち消して光学的に中央へ */
    text-indent: 0.22em;
    line-height: 1.3;
  }

  .rule {
    width: 3rem;
    height: 1px;
    margin: 2rem auto;
    border: 0;
    background: var(--rule);
  }

  p {
    margin: 0;
    font-size: clamp(0.95rem, 3.6vw, 1.0625rem);
    letter-spacing: 0.08em;
    line-height: 2;
    color: var(--ink-soft);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.75rem); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">店</div>
    <h1>じぶんの店</h1>
    <hr class="rule">
    <p>ただいま開店準備中です。</p>
  </main>
</body>
</html>
